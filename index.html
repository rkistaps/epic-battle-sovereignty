<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epic Battle: Sovereignty — turn-based war &amp; economy</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--panel2:#252931;--line:#353a44;--txt:#e7e9ee;--mut:#9aa1ad;--acc:#e0b354;--good:#5cc98a;--bad:#e96a5a;--info:#6aa9e9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#1a1a1a;border-color:var(--acc);font-weight:600}
button.sm{padding:2px 7px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input[data-allocpct]:disabled{opacity:.6}
input[inputmode],input[data-allocpct],#sName{width:80px;background:#0f1114;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit}
input[type=range]{accent-color:var(--acc)}
select{background:#0f1114;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px;font:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.5px;color:var(--acc)}
.chip{color:var(--mut)} .chip b{color:var(--txt);font-variant-numeric:tabular-nums}
.grow{flex:1}
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:12px;padding:12px;align-items:start}
#split{display:none}
@media(min-width:981px){ /* map and side panel scroll separately; drag #split to resize */
  body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{flex:none}
  main{flex:1 1 auto;min-height:0;grid-template-columns:minmax(320px,1fr) 12px minmax(300px,var(--side,440px));gap:0;align-items:stretch}
  main>section{overflow:auto;min-height:0}
  #split{display:block;cursor:col-resize;touch-action:none;position:relative}
  #split::after{content:"";position:absolute;top:0;bottom:0;left:5px;width:2px;border-radius:1px;background:var(--line)}
  #split:hover::after,#split.drag::after{background:var(--acc)}
  body.splitting{cursor:col-resize;user-select:none}
}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
#mapwrap{position:relative;scrollbar-width:none}
#mapwrap::-webkit-scrollbar{display:none}
.mapbox{position:relative}
.h3btn,.thsort{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
textarea.names{width:100%;height:min(52vh,420px);resize:vertical;background:#0f1114;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13px/1.5 ui-monospace,Consolas,monospace}
textarea.names.chg{border-color:var(--acc)}
table.rank{table-layout:fixed;width:100%}
table.rank td:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sarr{display:inline-block;width:1em;text-align:center}
.thsort{white-space:nowrap}
.h3btn:hover,.thsort:hover,.thsort.on{color:var(--acc)}
.lvbox{display:inline-block;min-width:26px;text-align:center;font-weight:700;color:var(--acc);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums}
.lockbtn{padding:2px 4px;min-width:0;opacity:.55;background:none;border-color:transparent}
.lockbtn.on{opacity:1;border-color:var(--acc)}
.mapbox canvas{display:block;width:100%;border-radius:6px;cursor:grab;touch-action:none}
.mapbox canvas.drag{cursor:grabbing}
.mapctl{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.mapctl button{background:#000b;min-width:30px}
.mapctl button.on{border-color:var(--acc);color:var(--acc)}
#allyLegend{position:absolute;left:8px;bottom:8px;background:#000c;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;max-height:45%;display:flex;flex-direction:column;max-width:60%}
#allyLegend .lgbody{overflow:auto;margin-top:4px}
#allyLegend .lgbody div{white-space:nowrap}
#allyLegend .lghead{background:none;border:0;padding:2px 0;font-size:12px;font-weight:600;text-align:left;cursor:pointer;color:var(--txt)}
#allyLegend .lghead:hover{color:var(--acc)}
/* Alliances tab: number columns size to their content, the name column takes what's left */
table.rank.atab{table-layout:auto}
table.atab th,table.atab td{white-space:nowrap}
table.atab td.r,table.atab th.r{padding-left:12px}
table.atab td.nm{width:100%;max-width:0}
table.atab .nmtxt{overflow:hidden;text-overflow:ellipsis}
table.atab td.pl,table.atab th.pl{text-align:right;padding-right:8px;color:var(--mut);font-variant-numeric:tabular-nums}
.pips{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;max-width:100%}
.pips i{display:block;width:6px;height:6px;border-radius:1px}
.pips i.off{background:#3a3f4a !important}
.sbar{height:5px;border-radius:3px;background:#3a3f4a;margin-top:4px;overflow:hidden}
.sbar i{display:block;height:100%}
#tip{position:fixed;z-index:5;pointer-events:none;background:#000c;border:1px solid var(--line);padding:6px 8px;border-radius:6px;font-size:12px;display:none;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px!important}
.tabs button{border-radius:6px;padding:5px 6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc)}
h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
h3:first-child{margin-top:0}
table{border-collapse:collapse;width:100%}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:500;font-size:12px}
td.r,th.r{text-align:right}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:5px 0}
.mut{color:var(--mut)} .good{color:var(--good)} .bad{color:var(--bad)} .acc{color:var(--acc)}
.bar{height:6px;background:#0f1114;border-radius:3px;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--info)}
.odds{position:relative;height:10px;background:#0f1114;border-radius:5px;margin:6px 0 2px}
.odds i{display:block;height:100%;border-radius:5px}
.odds b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--mut)}
.oddsl{position:relative;height:16px} .oddsl span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.gen{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
.note{background:#2b2618;border:1px solid #5a4a22;border-radius:8px;padding:8px;margin:8px 0;font-size:13px}
.warn{background:#341d1a;border-color:#6d2f27}
#end{font-size:15px;padding:8px 18px}
.auto{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;white-space:nowrap}
#bAuto{min-width:84px}
.menu,.split{position:relative;display:inline-flex}
.split>#bAuto{border-radius:6px 0 0 6px} .split>#bAutoOpt{border-radius:0 6px 6px 0;border-left:0;padding:5px 7px}
.pop{position:absolute;top:calc(100% + 4px);left:0;z-index:20;display:flex;flex-direction:column;gap:2px;min-width:190px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
.pop[hidden]{display:none} .pop.right{left:auto;right:0}
.pop>button{text-align:left;background:none;border:0;border-radius:5px;padding:7px 10px} .pop>button:hover:not(:disabled){background:var(--panel2)}
.prow2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px;font-size:13px}
#bAuto.on{border-color:var(--acc);color:var(--acc)}
#toast{position:fixed;right:16px;bottom:16px;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;box-shadow:0 4px 16px #0008;max-width:calc(100vw - 32px)}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.overlay.solid{background:var(--bg)} /* hot-seat handover: hides the previous player's screen */
.handover h2{display:flex;align-items:center;justify-content:center;gap:10px}
.hsw{width:22px;height:22px;border-radius:6px;display:inline-block;flex:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:720px;width:100%;max-height:90vh;overflow:hidden;padding:18px;display:flex;flex-direction:column}
/* every window: header and footer stay put, only .mbody scrolls (modal() wraps the middle in .mbody) */
.modal>*{flex:none}
.modal>.mbody{flex:1 1 auto;min-height:0;overflow:auto;padding-right:4px}
.modal>.mfoot{margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.modal h2{margin:0 0 10px;color:var(--acc)}
/* year report: "Elsewhere" has its own scroll */
/* battle report window */
.modal.battle{max-width:1040px}
.bsides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.bsides{grid-template-columns:1fr}}
.bside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.bside h4{margin:0;font-size:16px}
.btag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--mut);margin-left:6px;vertical-align:2px;font-weight:400}
.brole{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.bgen{display:flex;gap:10px;align-items:center;background:#0f111466;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:8px 0}
.lossbar{display:inline-block;width:44px;height:5px;background:#0f1114;border-radius:3px;overflow:hidden;vertical-align:1px;margin-left:6px}
.lossbar i{display:block;height:100%;background:var(--bad)}
.bmult td{border-bottom:1px dashed #353a4488;padding:3px 6px}
.bmult tr.tot td{border-bottom:0;border-top:1px solid var(--line);font-weight:700}
.bcalc{background:#0f111466;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.bchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bchips span{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px}
.sbar2{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:4px 0 2px}
.sbar2 i{display:block;height:100%}
.modal.battle .stat .sub{text-transform:none;letter-spacing:0;font-size:12px}
.rep-scroll{max-height:min(34vh,300px);overflow:auto;border:1px solid var(--line);border-radius:8px;padding:2px 10px;background:#0f111466}
.rep-foot{display:flex;align-items:center;gap:8px}
.rep-foot .small{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.stat .mut{font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stat span:last-child{font-size:12px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.log li{margin:3px 0}
/* change log window */
.cl details{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin:6px 0}
.cl summary{cursor:pointer;padding:8px 10px;display:flex;gap:10px;align-items:baseline;list-style:none}
.cl summary::-webkit-details-marker{display:none}
.cl summary::before{content:"▸";color:var(--mut)} .cl details[open] summary::before{content:"▾"}
.cl summary b{flex:1} .cl summary time{font-size:12px;color:var(--mut);white-space:nowrap}
.cl ul{margin:0;padding:0 12px 10px 34px}
.hidden{display:none}
/* New game window: two columns (settings + live summary); tokens from the design handoff */
.modal.setup{--s-surf:#1F2024;--s-sum:#18191D;--s-in:#121316;--s-div:#34363C;--s-inb:#3A3C42;--s-t1:#ECEAE3;--s-t2:#C9C8C0;--s-mut:#A3A39A;--s-acc:#E3B964;--s-acch:#F0CC82;
  max-width:1000px;padding:0;border-radius:16px;background:var(--s-surf);border-color:var(--s-div);color:var(--s-t1)}
.modal.setup>.sbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;padding:0}
.modal.setup .sl{padding:4px 32px 24px}
.modal.setup .mut{color:var(--s-mut)}
.modal.setup input[type=range],.modal.setup input[type=checkbox]{accent-color:var(--s-acc)}
.modal.setup input[type=text],.modal.setup input[inputmode],.modal.setup select{height:44px;background:var(--s-in);border:1px solid var(--s-inb);border-radius:8px;color:var(--s-t1);padding:0 12px;font-size:14px;width:100%}
.modal.setup select:disabled{opacity:.45}
.modal.setup button{border-radius:8px}
.modal.setup button.pri{background:var(--s-acc);border-color:var(--s-acc);height:44px;padding:0 24px;font-size:15px}
.modal.setup button.pri:hover{background:var(--s-acch)}
.modal.setup button.out{background:transparent;border-color:var(--s-inb);height:44px;padding:0 20px;font-size:15px}
.modal.setup :focus-visible{outline:2px solid var(--s-acc);outline-offset:2px}
.modal.setup .hidden{display:none!important}
.modal.setup #sName{width:100%}
.sl section{margin-top:20px}
.sl section>.sh{margin-top:0}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:28px 32px 12px;border-bottom:1px solid var(--s-div)}
.shead h2{margin:0;font-size:28px;color:var(--s-acc)}
.modal.welcome{--s-surf:#1F2024;--s-in:#121316;--s-div:#34363C;--s-inb:#3A3C42;--s-t1:#ECEAE3;--s-mut:#A3A39A;--s-acc:#E3B964;--s-acch:#F0CC82;
  max-width:420px;padding:32px;border-radius:16px;background:var(--s-surf);border-color:var(--s-div);color:var(--s-t1);text-align:center}
.welcome .brand{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--s-acc)}
.welcome h2{margin:8px 0 20px;font-size:28px;color:var(--s-t1)}
.welcome .lead{margin:-6px 0 24px;color:var(--s-mut);font-size:14.5px;line-height:1.5}
.welcome .save{padding:14px 16px;border:1px solid var(--s-div);border-radius:10px;background:var(--s-in);margin-bottom:20px}
.welcome .save b{display:block;font-size:17px;font-weight:600}
.welcome .save span{font-size:13px;color:var(--s-mut)}
.welcome .acts{display:flex;flex-direction:column;gap:10px}
.modal.welcome>.mfoot{border:0;padding:0;margin:0}
.welcome .acts button{height:46px;border-radius:8px;font-size:15px}
.welcome button.pri{background:var(--s-acc);border-color:var(--s-acc)} .welcome button.pri:hover{background:var(--s-acch)}
.welcome button.out{background:transparent;border-color:var(--s-inb)}
.welcome :focus-visible{outline:2px solid var(--s-acc);outline-offset:2px}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--s-div);border-radius:10px;background:var(--s-in)}
.seg button{border:0;background:transparent;padding:7px 18px;color:var(--s-t2)}
.seg button[aria-pressed=true]{background:var(--s-acc);color:#1a1a1a;font-weight:600}
.sh{margin:22px 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--s-mut)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:14px;color:var(--s-t2);min-width:0}
.fld>span{display:flex;align-items:center;gap:4px}
.fld .lr{justify-content:space-between}
.fld .lr input[inputmode]{width:84px;height:30px;text-align:right;font-weight:600}
.fld input[type=range]{width:100%;margin:0}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g3 .fld{margin-bottom:0}
.wrow{display:flex;gap:10px;align-items:center}.wrow select{width:170px!important;flex:none}
.more{border-top:1px solid var(--s-div);border-bottom:1px solid var(--s-div);margin-top:18px}
.mbtn{display:flex;align-items:center;gap:10px;width:100%;background:none!important;border:0!important;padding:16px 0;font-size:15px;color:var(--s-t1);text-align:left}
.mbtn .mut{margin-left:auto;font-size:13px}
.mbtn .chev{color:var(--s-acc);font-size:20px;line-height:1;transition:transform .15s}
.mbtn[aria-expanded=true] .chev{transform:rotate(90deg)}
#sMore{padding-bottom:12px}
#sMore>.fld:first-child{margin-top:2px}
.rules{display:flex;flex-direction:column;gap:4px}
.rule{display:flex;align-items:center;gap:6px}
.rule label{display:flex;align-items:flex-start;gap:10px;flex:1;cursor:pointer;padding:5px 0}
.rule input{margin-top:3px;width:16px;height:16px}
.rule b{display:block;font-weight:500}
.rule small{display:block;color:var(--s-mut);font-size:12.5px}
.alopts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:2px 0 8px 26px}
.alopts select{width:auto!important}.alopts input{width:80px!important}
.info{position:relative;background:none!important;border:0!important;padding:0 3px!important;color:var(--s-mut);font-size:14px;line-height:1;cursor:help}
#infoTip{position:fixed;z-index:40;max-width:260px;background:#0d0e10;border:1px solid #3A3C42;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4;color:#ECEAE3;box-shadow:0 6px 18px #0009;pointer-events:none}
.info:hover,.info:focus{color:var(--s-acc)}
.sfoot{display:flex;align-items:center;gap:10px}
.modal.setup>.sfoot{margin:0;padding:14px 32px;border-top:1px solid var(--s-div)}
/* hot-seat players list in the New game window */
.prow,.phdr{display:grid;grid-template-columns:22px minmax(0,1.4fr) repeat(3,minmax(0,1fr)) minmax(0,.9fr) 28px;gap:8px;align-items:center}
.phdr{font-size:12px;color:var(--s-mut);padding-bottom:4px;border-bottom:1px solid var(--s-div)}
.prow{padding:8px 0;border-bottom:1px solid var(--s-div)}
.prow .pn{color:var(--s-mut);font-size:13px;text-align:center}
.modal.setup .prow select,.modal.setup .prow input[type=text]{height:36px;font-size:13px;padding:0 8px;width:100%}
.prow .pst{font-size:13px;color:var(--s-t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pst .acc{color:var(--s-acc)}
.modal.setup .prow .px,.modal.setup .pst button{background:none;border:0;color:var(--s-mut);font-size:18px;padding:0 4px;height:auto}
.modal.setup .prow .px:disabled{opacity:.3}
.modal.setup .addp{background:none;border:1px dashed var(--s-inb);color:var(--s-acc);width:100%;margin-top:10px;height:38px;font-weight:600}
.seg2{display:inline-flex;gap:4px;padding:3px;border:1px solid var(--s-div);border-radius:8px;background:var(--s-in)}
.modal.setup .seg2 button{border:0;background:transparent;padding:6px 12px;color:var(--s-t2);font-size:13px}
.modal.setup .seg2 button[aria-pressed=true]{background:#2A2620;color:var(--s-acc);font-weight:600}
@media(max-width:520px){.shead{flex-wrap:wrap}.seg button{padding:7px 12px}}
.hal{flex-direction:row!important;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
@media(max-width:800px){.phdr{display:none}.prow{grid-template-columns:22px minmax(0,1fr) 28px}.prow>select,.prow>.pst{grid-column:2}}
.rnd{background:none!important;border:0!important;color:var(--s-acc);font-weight:600;padding:8px 4px!important}
.rnd:hover{color:var(--s-acch)}
.modal.setup>.sbody{background:linear-gradient(to right,var(--s-surf) calc(100% - 341px),var(--s-div) calc(100% - 341px),var(--s-div) calc(100% - 340px),var(--s-sum) calc(100% - 340px))}
.ssum{position:sticky;top:0;align-self:start;min-height:min(100%,calc(90vh - 164px));padding:28px 28px 24px;display:flex;flex-direction:column;min-width:0;box-sizing:border-box}
.ssum>.sh{margin-top:6px}
.sname{font-size:20px;font-weight:600;color:var(--s-t1);overflow-wrap:anywhere;margin-top:6px}
.ssum .sub{color:var(--s-t2);font-size:13.5px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:20px 0 0}

function migrateResearch(g){
  for(const c of g.countries){
    if(c.sci>0){ const tot=c.peasants+c.sci; c.work=c.work||{wood:0,iron:0}; c.work.sci=Math.min(80,Math.round(100*c.sci/Math.max(1,tot))); c.peasants=tot; c.sci=0;
      const sum=(c.work.wood||0)+(c.work.iron||0)+c.work.sci; if(sum>90){ const k=(90-c.work.sci)/Math.max(1,(c.work.wood||0)+(c.work.iron||0)); c.work.wood=Math.floor((c.work.wood||0)*k); c.work.iron=Math.floor((c.work.iron||0)*k); } }
    if(c.work&&c.work.sci==null) c.work.sci=0; }
  for(const c of g.countries){ if(!c.lv) continue;
    if(c.lv.mil!=null){ c.lv.atk=c.lv.def=c.lv.mil; c.rp.atk=c.rp.def=(c.rp.mil||0)/2; const a=c.alloc.mil||0; c.alloc.atk=c.alloc.def=a/2; delete c.lv.mil; delete c.rp.mil; delete c.alloc.mil; }
    for(const a of AREAS){ c.lv[a]??=0; c.rp[a]??=0; c.alloc[a]??=0; } }
  if(g.wonders) for(const w of g.wonders) if(w.area==="mil") w.area="def";
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

function levelCost(L,mul=1){ return Math.round(R.researchCostBase*Math.pow(L+1,R.researchCostExp)*mul); }
// average level of each area across living states (catch-up pricing compares against it)
function worldAvgLv(g){ const A=g.countries.filter(c=>c.alive&&c.lv), o={}; for(const a of AREAS) o[a]=A.length?A.reduce((s,c)=>s+(c.lv[a]||0),0)/A.length:0; return o; }
// what scales a state's level cost in an area: its size, and how far it is ahead of or behind the world average
function costParts(g,c,a){
  const size=R.sizeRef>0?Math.pow(Math.max(1,popOf(c)/R.sizeRef),R.sizeExp):1;
  const d=(c.lv[a]||0)-((g.avgLv||(g.avgLv=worldAvgLv(g)))[a]||0);
  const edge=d<0?Math.max(1-R.catchUpMax,1+R.catchUpPer*d):Math.min(Math.max(1,R.leadMax),1+R.leadPer*d);
  return {size,edge,d,mul:size*edge};
}

const TRAITS = {attack:"Attack", defense:"Defense", food:"Harvest", wood:"Wood", iron:"Iron", science:"Research", growth:"Pop. growth", housing:"Pop. capacity", explore:"Expansion"};
const civOf=c=>CIVS.find(x=>x.id===c.civ), leaderOf=c=>LEADERS.find(x=>x.id===c.leader), landOf=c=>LANDS.find(x=>x.id===c.landType);
function computeMods(civ,leader,land){
  const v=(o,k)=>!o?1:o[k], m={};
  const dev=k=>(v(civ,k)-1)+(v(leader,k)-1)+(v(land,k)-1), W=R.traitWeight;
  for(const k in TRAITS) m[k]=+(1+(W[k]??1)*dev(k)).toFixed(3);
  // optional link (off by default): food feeding more children
  m.capacity=+(1+W.housing*dev("housing")).toFixed(3);
  m.births=+(1+W.growth*dev("growth")+W.foodBirths*dev("food")).toFixed(3);
  return m;
}
function setTraits(c,civId,leaderId,landId){ c.civ=civId; c.leader=leaderId; if(landId!==undefined) c.landType=landId; c.mod=computeMods(civOf(c),leaderOf(c),landOf(c)); }
function M(c,k){ return c.mod?.[k]??1; } // modifier from civilization + leader (1 for old saves)
function atkTech(c){ return 1+R.atkPerLevel*lvl(c,"atk"); }
function defTech(c){ return 1+R.defPerLevel*lvl(c,"def"); }
function atkPower(c){ return atkTech(c)*M(c,"attack")*wonderMul(c,"atk"); }
function defPower(c){ return defTech(c)*M(c,"defense")*wonderMul(c,"def"); }
// strength per point of troop attack/defense when A attacks D: the research edge is capped at R.techEdgeMax×
function clashTech(A,D){
  let a=atkTech(A), d=defTech(D); const k=R.techEdgeMax;
  if(k>=1){ if(a>d*k) a=d*k; else if(d>a*k) d=a*k; }
  return [a,d];
}
function clashPowers(A,D){ const [a,d]=clashTech(A,D); return [a*M(A,"attack")*wonderMul(A,"atk"), d*M(D,"defense")*wonderMul(D,"def")]; }

const WONDERS = {sci:{name:"Great Library",icon:"📜",bonus:0.25}, agri:{name:"Hanging Gardens",icon:"🌿",bonus:0.25}, fin:{name:"Golden Exchange",icon:"💰",bonus:0.25},
                 dens:{name:"Tower of Babel",icon:"🗼",bonus:0.25}, grow:{name:"Temple of Life",icon:"🌸",bonus:0.25}, def:{name:"Iron Citadel",icon:"🏰",bonus:0.25},

const WONDER_EFFECT = {sci:"research",agri:"food",fin:"taxes",dens:"population capacity",grow:"birth rate",atk:"attack strength",def:"defense strength",wood:"wood",iron:"iron",explore:"land taken & settling"};
// diminishing returns: a level counts in full up to R.levelKnee, then grows with its square root (smooth at the knee)
function effLevel(L){ const K=R.levelKnee; return K>0&&L>K ? K*(2*Math.sqrt(L/K)-1) : L; }
// per-level setting of each area (its main effect) and the base it's measured against
const RES_PER={sci:"sciPerLevel",agri:"agriPerLevel",fin:"finTaxPerLevel",dens:"densPerLevel",grow:"growPerLevel",atk:"atkPerLevel",def:"defPerLevel",wood:"woodPerLevel",iron:"ironPerLevel",explore:"explorePerLevel"};
const resBase=a=>a==="dens"?R.popPerKm:a==="grow"?R.birthRate:1;
// effective level: with a cap, bonus = per×L ÷ (1 + per×L ÷ cap), so it starts at the full rate and approaches the cap
function lvl(c,a){ const L=effLevel(c.lv[a]||0), mx=R[a+"Max"], per=R[RES_PER[a]]; return mx>0&&per>0 ? L/(1+L*per/(mx*resBase(a))) : L; }
// research bonus of an area as a share of its base (0.6 = +60%)
function resBonus(c,a){ return R[RES_PER[a]]*lvl(c,a)/resBase(a); }
function wonderMul(c,a){ return c.wb&&c.wb[a] ? 1+(WONDERS[a]?.bonus??0.25) : 1; }
function wonderPct(a){ return Math.round((WONDERS[a]?.bonus??0.25)*100); }
function popCap(c){ return Math.round(c.land*(R.popPerKm+R.densPerLevel*lvl(c,"dens"))*M(c,"capacity")*wonderMul(c,"dens")); }
function growthRate(c){ return (R.birthRate+R.growPerLevel*lvl(c,"grow"))*M(c,"births")*wonderMul(c,"grow"); }
// food per year: farmers × rate × Agriculture (+4.5%/level) × shore farmland × civilization/leader/land food bonus
function foodPerFarmer(c){ return R.foodPerFarmer*(1+R.agriPerLevel*lvl(c,"agri"))*(1+shoreBonus(c))*M(c,"food")*wonderMul(c,"agri"); }
function foodProduction(c){ return Math.round(workers(c).farm*foodPerFarmer(c)); }
function popOf(c){ return c.peasants+c.sci+c.soldiers; }
function foodUse(c){ let f=c.peasants+c.sci; const tr=c.troops||{spear:c.soldiers}; for(const k in tr) f+=tr[k]*(TROOP[k]?.upFood??1); return Math.round(f); }
// peasants at work: woodcutters and miners by the work split; everyone else farms
function workers(c){ const w=c.work||{}, f=k=>Math.floor(c.peasants*(w[k]||0)/100), wood=f("wood"), iron=f("iron"), sci=f("sci"); return {wood,iron,sci,farm:c.peasants-wood-iron-sci}; }
function researchPoints(c){ return workers(c).sci*(1+R.sciPerLevel*lvl(c,"sci"))*M(c,"science")*wonderMul(c,"sci"); }
function production(c){ const w=workers(c); return {wood:Math.round(w.wood*R.woodPerWorker*M(c,"wood")*(1+R.woodPerLevel*lvl(c,"wood"))*wonderMul(c,"wood")), iron:Math.round(w.iron*R.ironPerWorker*M(c,"iron")*(1+R.ironPerLevel*lvl(c,"iron"))*wonderMul(c,"iron"))}; } // Forestry / Mining +6%/level

function affordable(c,t){ let n=Infinity; for(const r of RES) if(t[r]>0) n=Math.min(n,Math.floor((c[STOCK[r]]||0)/t[r])); return n===Infinity?0:n; }

const ATTACK_ORDER=TROOPS.slice().sort((a,b)=>(b.atk/b.def)-(a.atk/a.def)||b.atk-a.atk).map(t=>t.id);
function troopsOf(c){ if(!c.troops) c.troops={spear:c.soldiers||0}; return c.troops; } // older saves: everyone was a spearman
function troopCount(tr){ let n=0; for(const k in tr) n+=tr[k]; return n; }
function troopSum(tr,stat){ let s=0; for(const k in tr) s+=tr[k]*(TROOP[k]?TROOP[k][stat]:1); return s; }
function holdUnits(tr){ let s=0; for(const k in tr) s+=tr[k]*(TROOP[k]?.hold||1); return s; }

function armyDef(c,tr){ return troopSum(tr||troopsOf(c),"def")*defPower(c); }

function addTroops(c,id,n){ const tr=troopsOf(c); tr[id]=(tr[id]||0)+n; c.soldiers+=n; }
// take n troops out of a pool in a given order (pool is changed); returns what was taken
function takeTroops(pool,n,order){ const out={}; for(const k of order){ if(n<=0) break; const m=Math.min(n,pool[k]||0); if(m>0){ out[k]=m; pool[k]-=m; n-=m; } } return out; }
// take a chosen mix ({type:count}) out of a pool, capped to what's there (pool is changed)
function takeMix(pool,mix){ const out={}; for(const k in mix){ const m=Math.min(Math.max(0,Math.floor(mix[k]||0)),pool[k]||0); if(m>0){ out[k]=m; pool[k]-=m; } } return out; }

function removeTroops(c,n,mode){
  const tr=troopsOf(c); n=Math.min(n,troopCount(tr)); if(n<=0) return 0; let left=n;
  if(mode==="cheap"){ for(const t of TROOPS.slice().sort((a,b)=>troopValue(a)-troopValue(b))){ const m=Math.min(left,tr[t.id]||0); tr[t.id]=(tr[t.id]||0)-m; left-=m; } }
  else { const tot=troopCount(tr);
    for(const k in tr){ const m=Math.min(tr[k],Math.floor(n*tr[k]/tot)); tr[k]-=m; left-=m; }
    for(const k of Object.keys(tr).sort((a,b)=>tr[b]-tr[a])){ if(left<=0) break; const m=Math.min(left,tr[k]); tr[k]-=m; left-=m; } }
  c.soldiers=troopCount(tr); return n;
}

// so tougher troops survive better in any army, mixed or not
function casualties(tr,f){

  for(const k in tr){ if(!tr[k]) continue; const m=Math.min(tr[k],Math.round(f*tr[k]/(TROOP[k]?.tough||1))); if(m>0){ out[k]=m; n+=m; } }
  return {out,n};
}

    // each state moves at most 4 times so this can't loop
    const sur=t=>cnt[t]-target[t], moves=new Uint8Array(n);

      if(!cnt.some((_,t)=>sur(t)!==0)) break;

      for(let s=0;s<n;s++){ const A=team[s]; if(sur(A)<=0||moves[s]>=4) continue;

  C.forEach((c,i)=>c.team=team[i]);
}

// ---------- balance of power ----------
// If the biggest state holds much more than its share of the land, everyone else starts treating
// it as the common enemy. k (0..1) is how strongly: 0.25 at the threshold, 1 at twice the threshold.
function computeHegemon(g){
  const prev=g.hegemon?g.hegemon.id:null, alive=g.countries.filter(c=>c.alive);
  g.hegemon=null; g.hegemonNews=null;
  if(R.coalition&&alive.length>=3){
    let total=0, top=alive[0]; for(const c of alive){ total+=c.land; if(c.land>top.land) top=c; }
    const share=top.land/Math.max(1,total), trig=Math.min(R.coalitionMax,Math.max(R.coalitionShare/alive.length,R.coalitionMin));
    if(share>=trig) g.hegemon={id:top.id, share, x:share*alive.length, k:Math.min(1,0.25+0.75*(share-trig)/trig)}; // x = times an average share
  }
  const now=g.hegemon?g.hegemon.id:null;
  if(now!==prev) g.hegemonNews={from:prev,to:now};
}
// how much this AI cares about the coalition (0 if there is none or it is the leader)
function coalitionK(g,c){ const H=g.hegemon; return H&&H.id!==c.id&&g.countries[H.id].alive?H.k:0; }

// ---------- wonders ----------
// Six wonders on random land, each in a different state (when there are enough states),
// at least a minimum distance apart. The gap shrinks if the map is too crowded for it.
function placeWonders(g,rnd){
  const {W,H,cells}=g, land=[]; for(let i=0;i<cells.length;i++) if(cells[i]>=0) land.push(i);
  const distinct=g.countries.length>=AREAS.length, picks=[];
  let gap=Math.sqrt(land.length/AREAS.length)*0.6; // 60% of the spacing 6 evenly spread points would have
  for(const a of AREAS){
    let cell=-1;
    for(let t=0;cell<0;t++){
      const i=land[Math.floor(rnd()*land.length)], x=i%W, y=(i/W)|0;
      if(distinct&&picks.some(p=>cells[p]===cells[i])) continue;
      if(picks.some(p=>(p%W-x)**2+(((p/W)|0)-y)**2<gap*gap)){ if(t%50===49) gap*=0.85; continue; }
      cell=i;
    }
    picks.push(cell);
  }
  g.wonders=AREAS.map((a,k)=>({area:a,cell:picks[k],owner:cells[picks[k]]}));
}
// who holds which wonder; also records changes of hands for the year report
function refreshWonders(g){
  g.countries.forEach(c=>c.wb={});
  g.wonderEvents=[];
  if(!g.wonders) return;
  for(const w of g.wonders){ const o=g.cells[w.cell];
    if(o!==w.owner){ g.wonderEvents.push({area:w.area,from:w.owner,to:o}); w.owner=o; }
    if(o>=0&&g.countries[o].alive) g.countries[o].wb[w.area]=true; }
}
function wondersOf(g,id){ return g.wonders?g.wonders.filter(w=>w.owner===id):[]; }

// ---------- terrain ----------
function valueNoise(W,H,scale,rnd){ // smooth random field with features about `scale` cells wide
  const gw=Math.ceil(W/scale)+2, gh=Math.ceil(H/scale)+2, grid=new Float32Array(gw*gh);
  for(let i=0;i<grid.length;i++) grid[i]=rnd();
  const out=new Float32Array(W*H), sm=t=>t*t*(3-2*t);
  for(let y=0;y<H;y++){ const fy=y/scale, y0=fy|0, ty=sm(fy-y0);
    for(let x=0;x<W;x++){ const fx=x/scale, x0=fx|0, tx=sm(fx-x0), i=y0*gw+x0;
      const a=grid[i]+(grid[i+1]-grid[i])*tx, b=grid[i+gw]+(grid[i+gw+1]-grid[i+gw])*tx;
      out[y*W+x]=a+(b-a)*ty; } }
  return out;
}
// returns a mask (1 = water). `unit` = typical state width in cells.
function makeWater(W,H,frac,style,unit,rnd){

    const v=new Float32Array(N); for(let i=0;i<N;i++) v[i]=a[i]+0.5*b[i]+0.25*c[i];
    // cut-off chosen so `lakeFrac` of the map is water (estimated from a sample)

    for(let k=0;k<S;k++) smp[k]=v[Math.floor(rnd()*N)];
    smp.sort(); const th=smp[Math.min(S-1,Math.floor(S*(1-lakeFrac)))];
    for(let i=0;i<N;i++) if(v[i]>th) m[i]=1;
    // smooth lake shores: a cell becomes water if 5+ of its 3x3 block is water (twice)
    for(let it=0;it<2;it++){ const c2=m.slice();
      for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ const i=y*W+x;

// winding rivers from edge to edge until the water target is met, with fords every ~1.5 state widths
function carveRivers(m,W,H,target,unit,rnd){
  let water=0; for(let i=0;i<m.length;i++) water+=m[i];
  const b=unit>=20?3:2, gap=Math.max(8,Math.round(unit*1.5)), river=new Uint8Array(m.length), fords=[];
  const paint=(x,y)=>{ for(let dy=0;dy<b;dy++)for(let dx=0;dx<b;dx++){ const X=x+dx,Y=y+dy;
    if(X<W&&Y<H){ const i=Y*W+X; if(!m[i]){ m[i]=1; river[i]=1; water++; } } } };
  for(let r=0; water<target && r<1000; r++){
    const side=Math.floor(rnd()*4); let x,y;
    if(side===0){x=rnd()*W;y=0;} else if(side===1){x=W-1;y=rnd()*H;} else if(side===2){x=rnd()*W;y=H-1;} else {x=0;y=rnd()*H;}

    const X=fx+dx,Y=fy+dy; if(X>=0&&Y>=0&&X<W&&Y<H){ const i=Y*W+X; if(river[i]){ m[i]=0; river[i]=0; } } }

// Even out state sizes after growth: bigger states hand border cells to smaller neighbors.

      if(nS>=0&&nS!==o&&(p<0||counts[nS]<counts[p])) p=nS;
      if(nW>=0&&nW!==o&&(p<0||counts[nW]<counts[p])) p=nW;

// Remove 1-cell bumps and notches: a cell joins the neighbor state that holds 5+ of its

function smoothStates(cells,W,H,counts){
  for(let pass=0;pass<3;pass++){
    let moved=0;
    for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
      const i=y*W+x, o=cells[i]; if(o<0) continue;
      const nN=cells[i-W], nE=cells[i+1], nS=cells[i+W], nW=cells[i-1], nNE=cells[i-W+1], nSE=cells[i+W+1], nSW=cells[i+W-1], nNW=cells[i-W-1];

      if(pc<5||counts[o]<=1) continue;

  const N=W*H, comp=new Int32Array(N).fill(-1), st=[]; let best=-1,bestN=0,id=0;
  for(let s=0;s<N;s++){ if(m[s]||comp[s]>=0) continue; let n=0; comp[s]=id; st.push(s);

    if((x>0&&cells[i-1]===a)||(x<W-1&&cells[i+1]===a)||(y>0&&cells[i-W]===a)||(y<H-1&&cells[i+W]===a)) n++;

function pickTraits(c,civ,leader,land){ const pick=(v,cur)=>v&&v!=="random"?v:cur; setTraits(c,pick(civ,c.civ),pick(leader,c.leader),pick(land,c.landType)); }

// work shares: each job up to WORK_MAX %, all jobs together up to WORK_TOTAL % (farmers are everyone else)
const WORK_MAX=80, WORK_TOTAL=90, WORK_KEYS=["wood","iron","sci"];
// set one job's share; if there's no room, unlocked other jobs shrink (biggest first), locked ones never change
function setWorkShare(c,k,pct){
  const w=c.work, lock=c.workLock||{}, others=WORK_KEYS.filter(x=>x!==k);
  pct=Math.max(0,Math.min(WORK_MAX,Math.round(+pct||0)));
  const cap=lock.farm?WORK_KEYS.reduce((s,x)=>s+(w[x]||0),0):WORK_TOTAL; // farmers locked: jobs only trade among themselves
  const free=cap-others.reduce((s,x)=>s+(w[x]||0),0);

  const give=others.filter(x=>!lock[x]).sort((a,b)=>(w[b]||0)-(w[a]||0));
  for(const x of give){ if(need<=0) break; const t=Math.min(w[x]||0,need); w[x]=(w[x]||0)-t; need-=t; }

// set the farmers' share: the unlocked jobs scale together, keeping their mix from base (the shares when a drag began)

    for(const x of todo){ raw[x]=tb?left*(B?(base[x]||0):1)/tb:left/todo.length; if(raw[x]>WORK_MAX){ raw[x]=WORK_MAX; left-=WORK_MAX; todo=todo.filter(y=>y!==x); capped=true; break; } }

  fl.sort((p,q)=>((raw[q[0]]||0)%1)-((raw[p[0]]||0)%1)); for(const f of fl){ if(rest<=0) break; if(f[1]<WORK_MAX){ f[1]++; rest--; } }

// set one area's share exactly; locked areas keep their share, the other unlocked areas rescale so the total is 100

// a relation value with its label, colored: red when hostile, green when friendly
function relCell(v){ const r=Math.round(v); return `<span class="${r<=-50?"bad":r>=20?"good":r<=-20?"acc":""}" style="white-space:nowrap" title="${relLabel(r)}">${r>0?"+":""}${r} <span class="small">${relLabel(r)}</span></span>`; }
function frontCell(a,d){ const sea=seaOnlyFront(G,a,d), w=frontWidth(G,a,d), b=frontBonusAD(G,a,d); return `${sea?"sea":w+" km"}${b>0?` <span class="bad small" title="${sea?"Sea crossing":"Narrow front"}: their defenders get this bonus">+${Math.round(b*100)}%</span>`:""}`; }
const ATK_PRESETS=[["p90","90% of all","90% of each troop type"],["x2","2× their defense","The fewest troops (most offensive first) whose attack is twice their estimated defense: enough for full land if the estimate holds. Battles have luck, so a win isn't certain."],["off","Offensive only","Every troop whose attack is higher than its defense"],["all","Everything","All troops at home"],["none","Clear","Send nothing"]];
// rough odds of an attack: their estimated defense and your attack per point of troop attack
function atkOdds(c,o,gen){ const theirDef=o.generals.find(x=>x.id===o.defGen), fb=frontBonusAD(G,c.id,o.id), [pA,pD]=clashPowers(c,o);
  return {est:troopSum(troopsOf(o),"def")*pD*genFactor(theirDef)*(1+R.defenderBonus)*(1+fb), per:pA*genFactor(gen)}; }

function doubleMix(home,c,o,gen){ const {est,per}=atkOdds(c,o,gen), m={}; let need=2*est;
  for(const k of ATTACK_ORDER){ const h=home[k]||0, u=TROOP[k].atk*per; m[k]=need>0&&u>0?Math.min(h,Math.ceil(need/u-1e-9)):0; need-=m[k]*u; }
  return m; }
function presetMix(home,p){
  if(p==="x2"){ const c=me(), o=G.countries[UI.attackTarget], gen=c.generals.find(g=>g.id===UI.atkGen); if(o&&gen&&atkOdds(c,o,gen).est>0) return doubleMix(home,c,o,gen); p="p90"; } // undefended: 90%
  const m={}; for(const t of TROOPS){ const h=home[t.id]||0; m[t.id]=p==="all"?h:p==="off"?(t.atk>t.def?h:0):p==="none"?0:Math.round(h*0.9); } return m; }

function atkMix(home){ if(!UI.atkMix){ UI.atkMix=presetMix(home,UI.atkPreset); UI.atkEdited=false; } const m={}; for(const t of TROOPS) m[t.id]=Math.min(UI.atkMix[t.id]||0,home[t.id]||0); return m; }
function mixShort(tr){ return TROOPS.filter(t=>tr[t.id]>0).map(t=>`<span title="${t.name}" style="white-space:nowrap">${t.icon} ${fmt(tr[t.id])}</span>`).join(" ")||"none"; }
// odds, odds bar and land for the attack being planned (refreshed live while typing)
function atkSummary(c,o,gen,send){
  const n=troopCount(send), {est,per}=atkOdds(c,o,gen), mine=troopSum(send,"atk")*per, r=est>0?mine/est:Infinity;

  const genRow=(g,v)=>multRow(g?`General ${esc(g[0])} (skill ${g[2]}, morale ${g[4]})`:"No general",v,g?`skill ${g[2]} → ${mul(0.4+g[2]*0.008)} · morale ${g[4]} → ${mul(0.5+g[4]/200)}`:"");
  // attacker card
  const aSide=!vis(b.att)?`<div class="bside"><div class="brole" style="color:var(--bad)">Attacker</div><h4>${nm(b.att)}</h4><div class="small mut" style="margin-top:6px">Hidden by fog of war.</div></div>`:
  `<div class="bside"><div class="brole" style="color:var(--bad)">Attacker</div>
    <h4>${nm(b.att)}${team(who[0])}</h4>
    <div class="small mut">${names(who.slice(1,4))} · ${fmt(landA0)}${b.taken?` → ${fmt(landA0+b.taken)}`:""} km² · ${fmt(who[4])} people</div>
    ${genBox(d.gA,"🎖️",!b.win)}
    ${troopTable(d.tA,d.lA,"atk","Sent")}
    <div class="small mut" style="margin-top:4px">Left at home to guard: ${fmt(d.home)} soldiers</div>
    <h3 style="margin-top:12px">How the strength adds up</h3>
    <table class="bmult small">
      <tr><td>Troop attack (soldiers × attack)</td><td class="r">${fmt(d.sA[0])}</td></tr>
      ${multRow(`🔬 Attack research, level ${d.lv[0]}${capNote(d.raw[0],d.sA[1])}`,d.sA[1])}
      ${multRow(traitLine(who.slice(1,4),"attack"),d.sA[2])}
      ${wonderRow("atk",d.sA[3])}
      ${genRow(d.gA,d.sA[4])}
      ${multRow("Battle luck",d.sA[5])}
      <tr class="tot"><td>Attack strength</td><td class="r">${fmt(strA)}</td></tr>
    </table></div>`;
  // defender card
  const front=b.fb>0.0005?(b.sea?"Sea crossing":`Narrow front (${b.front} km border)`):`Front: ${b.front} km border`;
  const dSide=!vis(b.def)?`<div class="bside"><div class="brole" style="color:var(--info)">Defender</div><h4>${nm(b.def)}</h4><div class="small mut" style="margin-top:6px">Hidden by fog of war.</div></div>`:
  `<div class="bside"><div class="brole" style="color:var(--info)">Defender</div>
    <h4>${nm(b.def)}${team(who[5])}</h4>
    <div class="small mut">${names(who.slice(6,9))} · ${fmt(landD0)}${b.taken?` → ${fmt(Math.max(0,landD0-b.taken))}`:""} km² · ${fmt(who[9])} people</div>
    ${genBox(d.gD,"🛡️",b.win&&!!d.sD)}
    ${d.sD?troopTable(d.tD,d.lD,"def","Guards")+`<div class="small mut" style="margin-top:4px">${d.nOn>1?`${d.nOn} attacks on ${plain(b.def)} this year: this battle drew ${Math.round(d.share*100)}% of its guards`:`All guards fought this battle (no other attacks on ${plain(b.def)} this year)`}</div>
    <h3 style="margin-top:12px">How the strength adds up</h3>
    <table class="bmult small">
      <tr><td>Troop defense (soldiers × defense)</td><td class="r">${fmt(d.sD[0])}</td></tr>
      ${multRow(`🔬 Defense research, level ${d.lv[2]}${capNote(d.raw[1],d.sD[1])}`,d.sD[1])}
      ${multRow(traitLine(who.slice(6,9),"defense"),d.sD[2])}
      ${wonderRow("def",d.sD[3])}
      ${genRow(d.gD,d.sD[4])}
      ${multRow("Defender bonus",d.sD[5])}
      ${multRow(front,d.sD[6])}
      ${multRow("Battle luck",d.sD[7])}
      <tr class="tot"><td>Defense strength</td><td class="r">${fmt(strD)}</td></tr>
    </table>`:`<div class="note">No guards were home: the attackers walked in and lost only ${Math.round(R.raidLoss*100)}% (divided by toughness).</div>`}</div>`;
  // summary
  const res=b.win?(b.guards===0?`walked into undefended ${nm(b.def)}`:`attacked ${nm(b.def)} and <b class="good">won</b>`)+`, taking <b>${fmt(b.taken)} km²</b> (${pct(b.taken,landD0)} of its land)`:`attacked ${nm(b.def)} and was <b class="bad">repelled</b>`;
  const ratio=strD>0?strA/strD:0;

    ${stat("Losses",vs(`<span class="bad">${fmt(lossA)}</span>`,`<span class="bad">${fmt(lossD)}</span>`),`${pct(lossA,sent)} vs ${pct(lossD,grd)} of soldiers`)}
    ${stat("Land taken",`${fmt(b.taken)} km²`,!b.win?"attack repelled":!d.sD?"no defenders: full gain":dec>=1?"decisive win: full gain":`${Math.round(dec*100)}% of the full gain (narrow win)`)}
    ${stat("Captured",`${fmt(aft[1])} peasants`,`+${fmt(aft[3])} grain looted`)}</div>`;
  const bar=d.sD?`<div class="sbar2"><i style="width:${100*strA/(strA+strD)}%;background:${A.color}"></i><i style="width:${100*strD/(strA+strD)}%;background:${D.color}"></i></div>
    <div class="small mut" style="display:flex;justify-content:space-between;gap:8px;margin-bottom:12px"><span>${plain(b.att)} ${pct(strA,strA+strD)}</span><span>Winning at twice the defender's strength takes the full gain</span><span>${plain(b.def)} ${pct(strD,strA+strD)}</span></div>`:"";
  // land and aftermath
  const pot=(reach+army)*ex*dec;
  const landCalc=b.win?`<b>Land taken:</b> (general's reach ${fmt(reach)} + army ${fmt(army)} <span class="mut">[${R.armyLand} × √${fmt(surv)} survivors]</span>) × Expansion ${mul(ex)} <span class="mut">[level ${d.lv[1]}, with civilization/leader/land]</span> × ${dec>=1?"full gain":`narrow win ${Math.round(dec*100)}%`} = ${fmt(pot)} km²
      <span class="mut">· the survivors could hold up to ${fmt(hold)} km² (cavalry hold 2 each) · ${plain(b.def)} had ${fmt(landD0)} km²</span> → <b>${fmt(b.taken)} km²</b>`
    :`<b>No land changed hands.</b> <span class="mut">The attack was beaten back.</span>`;

  if(vis(b.def)) chips.push(`😠 ${plain(b.def)}'s opinion of ${plain(b.att)}: ${aft[4]} → ${aft[5]}`);
  if(aft[6]) chips.push(`🤝 ${aft[6]} member${aft[6]>1?"s":""} of ${plain(b.def)}'s alliance −${R.relAlly} toward ${plain(b.att)}`);
  if(aft[7]) chips.push(`👀 ${aft[7]} neighbor${aft[7]>1?"s":""} of both −${+(R.relWitnessNear*aft[9]).toFixed(1)}`);
  if(aft[8]) chips.push(`👀 ${aft[8]} other neighbor${aft[8]>1?"s":""} of ${plain(b.att)} −${+(R.relWitness*aft[9]).toFixed(1)}`);
  if((aft[7]||aft[8])&&aft[9]<1) chips.push(`↩ Revenge: neighbors judge it ${Math.round((1-aft[9])*100)}% less harshly`);
  if(b.elim) chips.push(`☠ ${plain(b.def)} was destroyed: ${fmt(aft[10])} of its people joined ${plain(b.att)}`);
  // footer: back, map, previous/next, research edge
  const list=reportList(ref), at=list.indexOf(ref), prev=at>0?list[at-1]:null, next=at>=0&&at<list.length-1?list[at+1]:null;
  const mapId=D.alive?b.def:b.att, edge=d.raw[1]>0?d.raw[0]/d.raw[1]:1;
  return `<div class="rep-head"><div class="row" style="justify-content:space-between;margin:0 0 4px"><h2>⚔️ Battle report · Year ${b.turn}</h2>
      <span class="small mut">${d.nOn>1?`${d.nOn} attacks on ${plain(b.def)} this year`:`The only attack on ${plain(b.def)} this year`} · ${b.front} km border</span></div>
    <div style="font-size:15px;margin-bottom:10px">${nm(b.att)} ${res}.</div></div>
    ${stats}${bar}
    <div class="bsides">${aSide}${dSide}</div>
    <h3>Land and aftermath</h3>
    <div class="bcalc small">${landCalc}</div>
    ${chips.length?`<div class="bchips">${chips.map(c=>`<span>${c}</span>`).join("")}</div>`:""}
    <div class="rep-foot">
      ${UI.repBack?`<button data-repback="1">‹ Back to year report</button>`:""}
      ${vis(mapId)?`<button data-repmap="${mapId}">🗺 Show on map</button>`:""}
      <button data-rep="${prev||""}" ${prev?"":"disabled"}>‹ Previous battle</button><button data-rep="${next||""}" ${next?"":"disabled"}>Next battle ›</button>
      <span class="small mut" title="Attack research ÷ defense research. In battle, one side's research counts at most ${R.techEdgeMax}× the other's.">Research edge: ${edge>=1?"attacker":"defender"} ${(edge>=1?edge:1/edge).toFixed(2)}× (cap ${R.techEdgeMax}×)</span>
      <button class="pri" data-repclose="1">Close</button></div>`;
}

function getPath(o,path){ return path.split(".").reduce((a,k)=>a==null?a:a[k],o); }

  const out={}, d=DEFAULTS, eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  for(const k of Object.keys(d.R)){ if(d.R[k]&&typeof d.R[k]==="object"){ for(const kk of Object.keys(d.R[k])) if(!eq(v.R[k][kk],d.R[k][kk])) (out.R??={})[k+"."+kk]=v.R[k][kk]; }
    else if(!eq(v.R[k],d.R[k])) (out.R??={})[k]=v.R[k]; }
  for(const t of ["troops","civs","leaders","lands"]) d[t].forEach((row,i)=>{ for(const f of Object.keys(row)) if(f!=="id"&&!eq(v[t][i][f],row[f])) ((out[t]??={})[row.id]??={})[f]=v[t][i][f]; });
  for(const a of Object.keys(d.wonders)) for(const f of Object.keys(d.wonders[a])) if(!eq(v.wonders[a][f],d.wonders[a][f])) ((out.wonders??={})[a]??={})[f]=v.wonders[a][f];
  if(v.names&&v.names.length&&!eq(v.names,d.names)) out.names=v.names;
  if(v.anames&&v.anames.length&&!eq(v.anames,d.anames)) out.anames=v.anames;
  return out;
}

function modal(html,cls){ const m=$("modal"), c="modal"+(cls?" "+cls:""), ov=$("ov"), y=!ov.classList.contains("hidden")&&m.className===c?m.querySelector(".mbody")?.scrollTop||0:0;
  m.className=c; m.innerHTML=html;
  if(!m.querySelector(":scope>.mbody")){ const k=[...m.children]; let i=0,j=k.length;
    while(i<j&&k[i].matches("h2,.brand,.rep-head")) i++;
    if(j>i&&k[j-1].matches(".row,.rep-foot,.acts")&&k[j-1].querySelector("button")) j--;
    if(j>i){ const b=document.createElement("div"); b.className="mbody"; m.insertBefore(b,k[j]||null); k.slice(i,j).forEach(e=>b.appendChild(e)); } }
  const f=m.lastElementChild; if(f&&f.matches(".row,.rep-foot,.acts")&&f.querySelector("button")) f.classList.add("mfoot");
  const b=m.querySelector(".mbody"); if(b) b.scrollTop=y; ov.classList.toggle("solid",/\bhandover\b/.test(c)); ov.classList.remove("hidden"); }

// prev = your state's numbers before the turn: {land, money, grain, pop}
function snapshot(c){ return {land:c.land,money:c.money,grain:c.grain,pop:popOf(c)}; }
// balance of power banner (World tab and War tab)
function coalitionBanner(){
  const H=G.hegemon; if(!H||!G.countries[H.id].alive) return "";
  const h=G.countries[H.id], pct=Math.round(H.share*100), str=Math.round(H.k*100), x=(H.x||H.share*G.countries.filter(c=>c.alive).length).toFixed(1);
  if(H.id===G.player) return `<div class="note warn">⚖ <b>You are pulling ahead:</b> you hold ${pct}% of the land, ${x}× an average state's share. Your neighbors are uniting against you: they arm more, stop fighting each other and focus their attacks on you. <span class="mut">(Coalition strength ${str}%.)</span></div>`;
  if(!isKnown(H.id)) return `<div class="note">⚖ A far-off state is pulling ahead: it holds ${pct}% of the land, ${x}× an average state's share. Its neighbors are uniting against it.</div>`;
  const mine=adjacency(G)[H.id].has(G.player)&&me().alive;
  return `<div class="note">⚖ <span class="sw" style="background:${h.color}"></span><b>${esc(h.name)}</b> is pulling ahead: it holds ${pct}% of the land, ${x}× an average state's share. Its neighbors are uniting against it${mine?": you border it, so its other neighbors are your allies of convenience":""}. <span class="mut">(Coalition strength ${str}%.)</span> <button class="sm" data-pick="${H.id}">Show</button></div>`;
}
function coalitionNews(){
  const n=G.hegemonNews; if(!n) return "";
  const nm=id=>id===G.player?"you":(isKnown(id)||G.countries[id].alive===false)?esc(G.countries[id].name):"a far-off state";
  const txt = n.to==null ? `The coalition against ${nm(n.from)} has broken up: no state is far ahead any more.`
    : n.to===G.player ? `<b>You are pulling ahead of everyone.</b> Your neighbors are forming a coalition against you.`
    : n.from==null ? `<b>${nm(n.to)}</b> is pulling ahead of everyone. Its neighbors are forming a coalition against it.`
    : `<b>${nm(n.to)}</b> has overtaken ${nm(n.from)} as the leading state. The coalition turns against it.`;
  return `<div class="note ${n.to===G.player?"warn":""}">⚖ ${txt}</div>`;
}
function wonderNews(){
  const ev=(G.wonderEvents||[]).filter(e=>e.to===G.player||e.from===G.player||(e.to>=0&&isKnown(e.to))||(e.from>=0&&isKnown(e.from))||!G.fog);
  if(!ev.length) return "";
  const nm=id=>id===-1?"unowned land":id>=0&&(isKnown(id)||id===G.player)?`<span class="sw" style="background:${G.countries[id].color}"></span>${esc(G.countries[id].name)}`:"an unknown state";
  return `<h3>Wonders</h3><ul class="log">${ev.map(e=>`<li class="${e.to===G.player?"good":e.from===G.player?"bad":""}">${WONDERS[e.area].icon} <b>${WONDERS[e.area].name}</b>: ${e.to===-1?`now stands on unowned land (was ${nm(e.from)})`:e.from===-1?`${nm(e.to)} settled it`:`${nm(e.to)} took it from ${nm(e.from)}`}</li>`).join("")}</ul>`;
}
// under fog: was this (now dead) state next to you? Its old land touches yours if so.
function neighborsBefore(id){ const {W,cells}=G, tf=G.takenFrom, N=cells.length; if(!tf) return false;
  for(let i=0;i<N;i++){ if(tf[i]!==id||cells[i]!==-1) continue; const x=i%W;
    if((x>0&&cells[i-1]===G.player)||(x<W-1&&cells[i+1]===G.player)||(i>=W&&cells[i-W]===G.player)||(i+W<N&&cells[i+W]===G.player)) return true; }
  return false; }
function turnReport(prev){
  const c=me(), now=snapshot(c);
  const mine=G.battles.filter(b=>b.att===G.player||b.def===G.player);
  const others=G.battles.filter(b=>!(b.att===G.player||b.def===G.player)&&seenBattle(b))
    .sort((x,y)=>(y.elim-x.elim)||(y.taken-x.taken)); // destroyed states first, then biggest gains
  const collapsed=(G.collapsed||[]).filter(id=>id!==G.player&&(!G.fog||neighborsBefore(id)));
  const fallen=others.filter(b=>b.elim).length+collapsed.length;
  const collapseLines=collapsed.map(id=>`<li><span class="sw" style="background:${G.countries[id].color}"></span><b>${esc(G.countries[id].name)}</b> collapsed from famine. <span class="mut">Its land is now unowned.</span></li>`).join("");
  const yr=G.turn-1, diedNow=(G.over==="lose"||!!G.hot)&&!c.alive&&c.diedTurn===yr, W_=G.worldOver&&G.winner!=null?G.countries[G.winner]:null;
  const WT=G.worldOver&&G.winnerTeam!=null&&G.teams?G.teams[G.winnerTeam]:null;
  const win=G.over==="win"||(!!G.hot&&!!G.worldOver&&(WT?c.team===WT.id:G.winner===c.id)); // hot-seat: did this player win?
  const head=win&&WT?`<h2>🏆 Victory!</h2><p>Your alliance, <b>${esc(WT.name)}</b>, has won the war in year ${yr}.${c.alive?"":` ${esc(c.name)} fell along the way, but its allies finished the job.`}</p>`:
    win?`<h2>🏆 Victory!</h2><p>${esc(c.name)} rules the entire continent in year ${yr}.</p>`:
    WT&&!diedNow?`<h2>🏁 ${esc(WT.name)} wins the war</h2><p class="mut">Year ${yr}. Only its members are left standing.</p>`:
    diedNow?`<h2>☠ Defeat</h2><p>${esc(c.name)} has fallen in year ${yr}${c.killer!=null?` to ${esc(G.countries[c.killer].name)}`:" to famine. Its land is now unowned"}.</p>${G.worldOver?"":G.hot?`<p class="mut small">Take over a computer state, watch the others play, or leave the game.</p>`:`<p class="mut small">You can keep watching (press Next year or use Auto to see who wins), or take over another state: click it on the map and press Take over.</p>`}`:
    W_?`<h2>🏁 ${esc(W_.name)} unites the continent</h2><p class="mut">Year ${yr}. The last state standing.</p>`:
    watching()?`<h2>Year ${yr} report <span class="mut small" style="font-weight:400">· ${observing()?"observer":"watching"}</span></h2>`:
    `<h2>Year ${yr} report</h2>`;
  const stat=(label,k,unit="")=>{ const d=now[k]-(prev?.[k]??now[k]);
    return `<div class="stat"><span class="mut">${label}</span><b>${fmt(now[k])}${unit}</b>${d?`<span class="${d>0?'good':'bad'}">${d>0?"+":""}${fmt(d)}</span>`:'<span class="mut">±0</span>'}</div>`; };
  modal(`${head}
  <div class="mbody">
    ${observing()?`<div class="small mut">${fmt(G.countries.filter(x=>x.alive).length)} states remain · grain price next year: <b>${G.price}</b></div>`:`<div class="stats">${stat("Land","land"," km²")}${stat("Money","money")}${stat("Grain","grain")}${stat("Population","pop")}</div>
    <div class="small mut">Grain price next year: <b>${G.price}</b></div>
    ${mine.length?`<h3>Your battles</h3><ul class="log">${mine.map(battleLine).join("")}</ul>`:""}
    <h3>Home</h3><ul class="log">${(c.log||G.log||[]).map(l=>`<li>${esc(l)}</li>`).join("")||"<li class='mut'>Quiet year.</li>"}</ul>`}
    ${coalitionNews()}
    ${wonderNews()}
    <h3>Elsewhere${others.length||collapsed.length?` <span class="mut small" style="text-transform:none;letter-spacing:0">· ${fmt(others.length)} battle${others.length!==1?"s":""}${fallen?`, ${fallen} state${fallen>1?"s":""} destroyed`:""}</span>`:""}</h3>
    ${others.length||collapsed.length?`<div class="rep-scroll"><ul class="log small">${collapseLines}${others.map(battleLine).join("")}</ul></div>`:`<div class="mut small">No other wars${G.fog?" that you could see":""} this year.</div>`}
  </div>
  <div class="rep-foot">${!canPlay()?`<button class="pri" data-a="newGame">New game</button><button data-a="close">View map</button>`:G.hot&&!c.alive?`<button class="pri" data-a="pickTakeover">Take over a state</button><button data-a="close">Watch</button><button data-a="hotLeave">Leave the game</button>`:diedNow?`<button class="pri" data-a="close">Keep watching</button><button data-a="pickTakeover">Take over a state</button><button data-a="newGame">New game</button>`:`<button class="pri" data-a="close">Continue</button>`}<span class="small mut">Enter or Esc to close</span></div>`,"report");
  $("modal").querySelector(".rep-foot .pri")?.focus({preventScroll:true});
}

function helpModal(){
  modal(`<h2>Rules &amp; tips</h2>
  <p><b>Goal:</b> conquer every other state. You start with the same land and resources as everyone else. Each turn is one year, and everyone moves at the same time.</p>
  <p><b>Switching sides:</b> click any state on the map and press <b>Take over</b> to rule it (the computer gets yours). This also works in observer mode and after a defeat. Click your own state and press <b>Hand to computer</b> to give it away and keep watching.</p>
  <p><b>Hot-seat:</b> several players share this device. Each takes a turn behind a handover screen, and the last one's <b>End year</b> runs the year. Everyone then sees their own report and fog of war. Orders like training and trading happen at once, so with <i>Rotate turn order</i> on, who goes first changes every year. A fallen player can take over a computer state, watch, or leave. Players can't take over another player's state, and auto-run is off while two or more players are in the game.</p>
  <h3>Economy</h3><ul class="log">
  <li>Peasants who don't cut wood or mine are farmers: each grows ${R.foodPerFarmer} grain a year, more with Agriculture research, shore farmland and food bonuses. All peasants pay taxes.</li>
  <li>Everyone eats 1 grain a year, and people eat <i>before</i> the harvest. If seed plus food is more than your stock, people starve, soldiers first.</li>
  <li>Taxes and selling surplus grain are your income. Scientists cost ${R.sciWage}/yr and cavalry needs gold upkeep. If you can't pay, they quit.</li>
  <li><b>Shore farmland:</b> land touching water harvests more: +1% for every 1% of your land on the shore, up to +${R.shoreMax*100}%.</li>
  <li>Population grows toward capacity (land × density). Pop. density and growth research raise it.</li></ul>
  <h3>Science</h3><ul class="log"><li>Scientists produce research points. Split them across ten areas. Science boosts all research, so invest in it early. Each level costs more than the last. Big states pay more per level (cost × √(population ÷ ${fmt(R.sizeRef)})). Ideas spread: an area costs ${Math.round(R.catchUpPer*100)}% less per level you are behind the world average (at most −${Math.round(R.catchUpMax*100)}%) and ${Math.round(R.leadPer*100)}% more per level you are ahead (at most ×${R.leadMax}). Each area's research bonus has a max (e.g. +${Math.round(R.atkMax*100)}% attack, +${Math.round(R.sciMax*100)}% research): early levels give the full amount, later ones less and less as the bonus nears the max. Civilization, leader, land and wonder bonuses multiply on top and can take the total past it.${R.levelKnee>0?` Levels above ${R.levelKnee} also have diminishing returns (they count with the square root).`:""}</li></ul>
  <h3>Resources</h3><ul class="log"><li>Food (grain), wood, iron and gold (money). Set what share of your peasants cut wood and mine iron in the Overview tab; the rest farm. Wood and iron train troops; trade any of them at the market.</li></ul>
  <h3>Troops</h3><ul class="log"><li>Six troop types, trained in the Barracks, all available from the start: Spearman, Archers, Axeman, Pikeman, Swordsman, Cavalry. Each has its own attack, defense, toughness, cost (food, wood, iron, gold) and upkeep (food, plus gold for cavalry). Battle losses are divided by toughness: wood troops (Spearman, Archers, Axeman) are cheap but die faster; iron troops (Pikeman, Swordsman, Cavalry) cost more but survive better. Attackers fight with attack, guards with defense; you pick which troops go on each attack (War tab), the rest stay home and guard. Every soldier is one person, so better troops mean more strength per head. Cavalry holds 2 km² of conquered land per soldier.</li></ul>
  <h3>Civilizations &amp; leaders</h3><ul class="log"><li>Every state has a civilization, a leader and a land type. Each gives bonuses and penalties to attack, defense, harvest, taxes, research, population growth, capacity and conquest; the three add together. Islands and Oceanic land only go to states with a coastline. Computer leaders also shape personality: Attackers and Warriors start wars early, Scientists rarely do, Defenders keep a big army home. Your Overview tab lists your bonuses.</li></ul>

  <li>You can only attack neighbors, and only with a general. Soldiers you send don't defend that year.</li>
  <li>Strength = soldiers × Attack/Defense research × general (skill and morale) × your civilization's and leader's attack (when attacking) or defense (when defending) bonus. A research lead counts at most ${R.techEdgeMax}× the other side's, so numbers still matter against a more advanced enemy. Defenders get +15%. A state with no guards loses as much land as the attacker's general and army can take.</li>
  <li>The winner takes land and the peasants on it: (general's Speed limit + ${R.armyLand}×√surviving soldiers) × decisiveness. Decisiveness runs from 25% for a narrow win to 100% at twice the defender's strength (or no defenders). Each surviving soldier can hold at most ${R.occupy} km².</li>
  <li><b>Relations:</b> every state has an opinion of every other, from −100 (hostile) to +100 (friendly). Years of peace with a neighbor build trust. Attacking someone angers them badly, angers their allies, and makes your other neighbors wary (less so if you're striking back at someone who attacked you within ${R.relJustYears} years). Growing much bigger than your neighbors' average size makes them nervous. Computer states attack the states they dislike first, avoid attacking friends, and guard less against friendly borders.</li>
  <li><b>Balance of power:</b> when one state holds far more than its share of the land (1.5× an average state's share, at least ${R.coalitionMin*100}% and at most ${R.coalitionMax*100}% of all land), its neighbors form a coalition. They arm more, stop fighting each other and attack it together, including when the leader is you.</li>

  <li><b>Wonders</b> (optional): ten landmarks, one per science area. Whoever holds the land a wonder stands on gets that area's effect raised by the wonder's bonus (+25% by default, e.g. +25% attack strength or +25% research). Conquer the land and the wonder is yours.</li>

  <li>Computer states remember who hurt them. Attack one repeatedly and it will focus on you.</li></ul>
  <h3>Strategy (from veterans of the original)</h3><ul class="log">
  <li>Build the economy first: scientists, Science, Agriculture and Finance. Don't counterattack small raids early.</li>
  <li>Don't be the biggest state or the weakest neighbor. Stay in the middle until your economy pulls ahead.</li>

  const s=UI.setup, tok=s.tok=(s.tok||0)+1; s.preview=null; s.pick=null; setPickText();
  const g=await ENGINE.call("newGame",{nStates:s.n,terr:s.terr,water:s.water,waterStyle:s.wstyle,map:s.map,wonders:s.wonders,civ:s.civ,leader:s.leader,landType:s.landType,difficulty:s.diff,alliances:allyOpts()});
  if(UI.setup!==s||s.tok!==tok) return; // settings changed meanwhile
  g.player=-1; s.preview=g; setPickText(); drawPreview();
}
function drawPreview(){
  const s=UI.setup, cv=$("pvc"); if(!cv) return;
  if(!UI.pvView||UI.pvView.cv!==cv){ UI.pvView?.destroy(); UI.pvView=new MapView(cv,{
    sel:()=>{ const s=UI.setup; if(!s) return null; if(s.hot&&!s.observer){ const P=picksOf(s).filter(x=>x!=null); return P.length?P[P.length-1]:null; } return s.pick??null; }, player:()=>-1, land:false, star:false,
    height:(w,g)=>Math.min(window.innerHeight*0.45,Math.max(220,w*g.H/g.W)),
    onPick:o=>{ const s=UI.setup; if(!s||!s.preview||o<0) return;
      if(s.hot&&!s.observer){ const P=picksOf(s), i=nextPick(s); if(P.includes(o)){ flash("Another player already has that state."); return; } if(i<0){ flash("Every player has a state. Clear one first."); return; } P[i]=o; }
      else s.pick=o;
      setPickText(); UI.pvView.refresh(); } }); }
  if(!s.preview){ makePreview(); return; }
  UI.pvView.setGame(s.preview); UI.pvView.refresh();
}

document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset.mkt){ const v=t.value.replace(/\D/g,""); if(v!==t.value) t.value=v; paintMkt(t.dataset.mkt); return; }
  if(t.id?.startsWith("trn-")){ const v=t.value.replace(/\D/g,""); if(v!==t.value) t.value=v; trainPreview(t.id.slice(4)); return; }
  if(t.dataset.sk&&UI.sdraft){ const k=t.dataset.kind; let v= k==="bool"?t.checked : k==="text"?t.value : k==="lines"?[...new Set(t.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))] : +t.value; if(k==="%") v=v/100;
    if(k!=="text"&&k!=="bool"&&k!=="lines"&&!isFinite(v)) return; setPath(UI.sdraft,t.dataset.sk,v);
    if(k==="lines"&&$("namesN")) $("namesN").textContent=fmt(v.length);
    const def=getPath(JSON.parse(JSON.stringify(DEFAULTS)),t.dataset.sk.replace(/^R\./,"R."));
    t.classList.toggle("chg",JSON.stringify(v)!==JSON.stringify(def)); return; }
  if(t.dataset.work){ const c=me(), k=t.dataset.work; if(k==="farm"){ UI.farmBase=UI.farmBase||{...c.work}; setFarmShare(c,t.value,UI.farmBase); } else setShare(c,k,t.value); const v=k==="farm"?farmShare(c):c.work[k]; if(+t.value!==v) t.value=v; paintWork(c,t); return; }
  if(t.dataset.workpct){ const v=t.value.replace(/\D/g,""); if(v!==t.value) t.value=v; return; } // digits only; applied on change
  if(t.dataset.allocpct){ const v=t.value.replace(/\D/g,""); if(v!==t.value) t.value=v; return; } // digits only
  if(t.dataset.alloc){ const box=t.parentElement.querySelector("[data-allocpct]"); if(box) box.value=t.value; return; } // live: show the number while dragging
  if(["gAge","gSpeed","gMind"].includes(t.id)){ const f=UI.genForm; f.age=+$("gAge").value; f.speed=+$("gSpeed").value; f.mind=+$("gMind").value;
    $("gAgeV").textContent=f.age; $("gSpeedV").textContent=f.speed; $("gMindV").textContent=f.mind; $("gPrice").textContent=fmt(genPrice(f.age,f.speed,f.mind)); $("gCap").textContent=speedCap(f); return; }
  if(t.dataset.atkmix){ const v=t.value.replace(/\D/g,""); if(v!==t.value) t.value=v; if(UI.atkMix){ UI.atkMix[t.dataset.atkmix]=+v||0; UI.atkEdited=true; refreshAtk(); } return; }
  const s=UI.setup; if(!s) return;
  if(t.id==="sName"){ s.empire=t.value; return; }
  if(t.id==="sPeace"){ const v=t.value.replace(/\D/g,""); if(v!==t.value) t.value=v; if(+v>0){ s.peace=Math.min(999,+v); updateSummary(); } return; }
  if(t.dataset.pf){ const [i,k]=t.dataset.pf.split("."), q=s.players[+i]; if(q) q[k]=k==="name"?t.value.slice(0,24):t.value; return; }
  if(t.id==="sN"||t.id==="sNV"){ const v=t.id==="sN"?N_STEPS[+t.value]:Math.floor(+t.value);
    if(t.id==="sNV"&&!(v>=2&&v<=1000)) return; // finish typing; clamped on change
    setStates(v,t.id); }
  if(t.id==="sAlN"){ const v=Math.floor(+t.value); if(v>=1){ s.alN=s.alMode==="count"?Math.max(2,v):v; $("sAlInfo").innerHTML=allyInfo(); } return; }
  if(t.id==="sT"){ s.terr=+t.value; $("sTV").textContent=s.terr; $("sTK").textContent=fmt(Math.round(s.terr*5.5))+" km² each"; s.preview=null; s.pick=null; }
