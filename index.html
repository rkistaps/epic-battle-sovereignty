document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.work){ UI.farmBase=null; render(); return; } // refresh the Food section after a slider is released
  if(t.id==="wLandRank"||t.id==="wAllyCol"){ const k=t.id; UI[k]=t.checked; try{ localStorage.setItem("eb."+k,t.checked?"1":"0"); }catch{} render(); return; }
  if(t.id==="autoSell"){ me().autoSell=t.checked; save(); return; }
  if(t.id==="newsF"||t.id==="newsQ"||t.id==="newsA"){ const st=UI.news; if(t.id==="newsF") st.f=t.value; else if(t.id==="newsA") st.al=t.value==="all"?"all":+t.value; else st.q=t.value; st.page=0; render(); return; }
  if(t.id==="settingsFile"&&t.files&&t.files[0]){ const f=t.files[0]; f.text().then(importSettings); t.value=""; return; }
  if(t.dataset.workpct){ setShare(me(),t.dataset.workpct,t.value); render(); return; }
  if(t.dataset.alloc||t.dataset.allocpct){ setAllocShare(me(),t.dataset.alloc||t.dataset.allocpct,t.value); render(); return; }
  if(t.id==="atkGen"){ UI.atkGen=+t.value; if(UI.atkPreset==="x2"&&!UI.atkEdited) UI.atkMix=null; render(); return; }
  if(t.dataset.atkmix){ const k=t.dataset.atkmix; t.value=Math.min(UI.atkMix?.[k]||0,plannedPools(me())[k]||0); return; }
  const s=UI.setup; if(!s) return;
  if(t.id==="sD"){ s.diff=+t.value; }
  // rebuild the preview when the slider is released (big maps take a moment)
  if(t.id==="sWS"){ s.wstyle=t.value; s.preview=null; s.pick=null; }
  if(t.id==="sMap"){ s.map=t.value; s.preview=null; s.pick=null; setupModal(); return; }
  if(t.id==="sObs"){ s.observer=t.checked; setupModal(); return; }
  if(t.id==="sAl"||t.id==="sAlMode"||t.id==="sAlLay"){ if(t.id==="sAl") s.al=t.checked; else if(t.id==="sAlMode"){ s.alMode=t.value; if(s.alMode==="count") s.alN=Math.max(2,s.alN); } else s.alLay=t.value;
    s.preview=null; s.pick=null; setupModal(); return; }
  if(t.id==="sAlN"){ s.preview=null; s.pick=null; if(s.choose&&!s.observer) drawPreview(); return; }
  if(t.id==="sNV"){ const v=Math.max(minStates(),Math.min(1000,Math.floor(+t.value)||s.n)); setStates(v,""); }
  if(["sN","sNV","sT","sW","sWS"].includes(t.id)&&s.choose) drawPreview();
  if(t.id==="sC"){ s.choose=t.checked; setupModal(); }
  if(t.id==="sF"){ s.fog=t.checked; }
  if(t.id==="sCiv"||t.id==="sLead"||t.id==="sLand"){ s[{sCiv:"civ",sLead:"leader",sLand:"landType"}[t.id]]=t.value; $("sTraits").innerHTML=setupTraits(); }
  if(t.id==="sRn"){ s.relNoise=t.checked; }
  if(t.id==="sRot"){ s.rotate=t.checked; }
  if(t.id==="sPeace"){ s.peace=Math.max(1,Math.min(999,Math.floor(+t.value)||s.peace)); t.value=s.peace; updateSummary(); }
  if(t.id==="sPc"){ s.peaceOn=t.checked; setupModal(); if(s.peaceOn) $("sPeace")?.select(); return; }
  if(t.id==="sWo"){ s.wonders=t.checked; s.preview=null; s.pick=null; if(s.choose) drawPreview(); }
});
// info tooltips: one floating box placed next to the hovered, focused or tapped ⓘ (works in every browser, never clipped)
{ let tipFor=null;
  const box=()=>$("infoTip")||document.body.appendChild(Object.assign(document.createElement("div"),{id:"infoTip",role:"tooltip",hidden:true}));
  const show=el=>{ const b=box(); tipFor=el; b.textContent=el.dataset.tip; b.hidden=false;
    const r=el.getBoundingClientRect(), w=b.offsetWidth, hh=b.offsetHeight;
    let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8), y=r.bottom+6; if(y+hh>innerHeight-8) y=r.top-hh-6;
    b.style.left=x+"px"; b.style.top=y+"px"; };
  const hide=()=>{ tipFor=null; const b=$("infoTip"); if(b) b.hidden=true; };
  document.addEventListener("pointerover",e=>{ const el=e.target.closest?.(".info[data-tip]"); if(el) show(el); });
  document.addEventListener("pointerout",e=>{ const el=e.target.closest?.(".info[data-tip]"); if(el&&!el.contains(e.relatedTarget)&&document.activeElement!==el) hide(); });
  document.addEventListener("focusin",e=>{ if(e.target.matches?.(".info[data-tip]")) show(e.target); else if(tipFor) hide(); });
  document.addEventListener("focusout",e=>{ if(e.target===tipFor) hide(); });
  document.addEventListener("focusin",e=>{ if(e.target.id?.startsWith("trn-")) trainPreview(e.target.id.slice(4)); });
  document.addEventListener("focusout",e=>{ if(e.target.id?.startsWith("trn-")&&!e.relatedTarget?.closest?.("[data-max],[data-train],[data-untrain]")) trainPreview(null); });
  document.addEventListener("click",e=>{ const el=e.target.closest?.(".info[data-tip]"); if(el){ tipFor===el&&!$("infoTip").hidden&&e.pointerType!=="mouse"?hide():show(el); } else if(tipFor) hide(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&tipFor) hide(); });
  document.addEventListener("scroll",()=>{ if(tipFor) tipFor.isConnected?show(tipFor):hide(); },true); }
// remember new-game choices (runs after the handlers above have updated UI.setup)
for(const ev of ["input","change"]) document.addEventListener(ev,e=>{ if(UI.setup&&e.target.closest?.("#modal")){ saveSetup(); updateSummary(); } });
// End a turn. Used by the End turn button and by auto-run.
async function endTurnNow(){
  if(!canPlay()||UI.busy) return; UI.busy=true; $("end").disabled=true;
  const prev=snapshot(me()), prevs={};
  // auto-sell after the snapshot, so the report shows the sale (hot-seat: for every human)
  for(const c of G.hot?G.hot.ids.map(id=>G.countries[id]):[me()]){ if(G.hot) prevs[c.id]=snapshot(c); if(c.autoSell&&c.alive&&!observing()){ const n=surplusGrain(c); if(n>0) act.sell(G,c,n); } }
  if(AUTO.on) showToast(`<span class="mut">Year ${G.turn}…</span>`);
  else modal(`<h2>Year ${G.turn}…</h2><p class="mut">The world is moving${ENGINE.inWorker?" (processing in the background)":""}.</p>`);
  try{ G=await ENGINE.call("endTurn",G); }
  catch(e){ console.error(e); UI.busy=false; setAuto(false); closeModal(); render(); flash("Turn failed: "+e.message); return; }
  if(G.hot){ UI.busy=false; UI.attackTarget=null; hotNewYear(prevs); return; }
  UI.busy=false; UI.attackTarget=null; UI.lastPrev=prev; AUTO.left=AUTO.sec*1000; render(); archiveTurn(); save();
  const attacked=G.battles.some(b=>b.def===G.player);
  const justDied=G.over==="lose"&&me().diedTurn===G.turn-1;
  if(AUTO.on && (!canPlay() || justDied || (AUTO.stop&&attacked&&me().alive))){ setAuto(false); turnReport(prev); if(attacked&&!G.over) flash("Auto-run stopped: you were attacked."); }
  else if(AUTO.on) toastReport(prev);
  else turnReport(prev);
}
$("end").addEventListener("click",()=>{ if(G?.hot&&!hotLast()&&canPlay()&&!UI.busy) hotDone(); else endTurnNow(); });

// ---------- hot-seat turn flow ----------
// Each year every human in G.hot.order takes a turn behind a handover screen; the last one runs the year.
// After the year, each player first sees their own report, then plays.
const hotLast=()=>G.hot.at>=G.hot.order.length-1;
const isHuman=id=>!!G.hot&&G.hot.ids.includes(id);
function hotHandover(){
  const h=G.hot, id=h.order[h.at], c=G.countries[id];
  modal(`<div class="brand">YEAR ${G.turn} · PLAYER ${h.at+1} OF ${h.order.length}</div>
  <h2><span class="hsw" style="background:${c.color}"></span>${esc(c.name)}</h2>
  <p class="lead">${c.alive?"Your turn.":"Your state has fallen."} Everyone else, look away.</p>
  <div class="acts"><button class="pri" data-a="hotBegin">${h.rep.includes(id)?"See last year's report":"Begin"}</button></div>`,"welcome handover");
  $("modal").querySelector(".acts .pri")?.focus({focusVisible:false});
}
function hotBegin(){
  const h=G.hot, id=h.order[h.at], c=G.countries[id];
  G.player=id; UI.sel=null; UI.attackTarget=null; UI.takeConfirm=null; UI.giveConfirm=false; UI.news=null; UI.repBack=null; UI.tab=c.alive?"economy":"world";
  closeModal(); render(); if(c.alive) mainView.centerOn(id,Math.max(mainView.z,mainView.focusZoom()));
  if(h.rep.includes(id)){ h.rep=h.rep.filter(x=>x!==id); save(); turnReport(h.prev[id]); }
}
function hotDone(){ G.hot.at++; save(); hotHandover(); }
// after the year: next year's order (rotated if on), and everyone still has to see their report
function hotNewYear(prevs){
  const h=G.hot; archiveTurn(); h.prev=prevs;
  if(G.over){ // the war is over: nothing left to hide, show the result once (from a winner's side if a human won)
    const W=h.ids.find(id=>G.winnerTeam!=null&&G.teams?G.countries[id].team===G.winnerTeam:G.winner===id);
    G.player=W??h.order[0]; h.rep=[]; save(); UI.sel=null; UI.tab="world"; render(); turnReport(prevs[G.player]); return; }
  h.rep=h.ids.slice(); h.first++; const n=h.ids.length, f=h.rotate?h.first%n:0;
  h.order=h.ids.map((_,i)=>h.ids[(f+i)%n]); h.at=0;
  save(); hotHandover();
}
// a player leaves the turn order (left the game or handed their state to the computer)
function hotRemove(id){
  const h=G.hot, pos=h.order.indexOf(id);
  h.ids=h.ids.filter(x=>x!==id); h.rep=h.rep.filter(x=>x!==id);
  if(pos>=0){ h.order.splice(pos,1); if(pos<h.at) h.at--; }
  if(h.ids.length<2){ hotToSolo(); return; }
  if(h.at>=h.order.length){ h.at=h.order.length-1; G.player=h.order[h.at]; endTurnNow(); return; } // they were last this year: run it
  save(); hotHandover();
}
// one human left: it becomes a normal game
function hotToSolo(){
  const h=G.hot, id=h.ids[0]; G.hot=null;
  if(id==null){ G.player=OBSERVER; G.observer=true; save(); closeModal(); render(); return; }
  const c=G.countries[id]; UI.soloRep=h.rep.includes(id)?h.prev[id]:null;
  G.player=id; if(!c.alive) G.over="lose"; save();
  modal(`<div class="brand">YEAR ${G.turn}</div><h2><span class="hsw" style="background:${c.color}"></span>${esc(c.name)}</h2>
  <p class="lead">You're the last player. The game goes on as a one-player game.</p>
  <div class="acts"><button class="pri" data-a="soloBegin">Continue</button></div>`,"welcome handover");
}
document.addEventListener("keydown",e=>{
  if($("ov").classList.contains("hidden")){ // no dialog open: Escape clears the map selection
    if(e.key==="Escape"&&UI.sel!=null&&!UI.busy&&!/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){ UI.sel=null; render(); }
    return;
  }
  if(UI.busy) return;
  const m=$("modal"), report=m.classList.contains("report");
  if(e.key==="Escape"||(report&&e.key==="Enter"&&canPlay())){
    const close=m.querySelector('[data-a="close"]'); if(close){ e.preventDefault(); close.click(); }
  }
});

// ---------- auto-run ----------
const AUTO={on:false,sec:3,stop:true,left:3000,last:performance.now()};
try{ const s=JSON.parse(localStorage.getItem("sovereign-auto")||"{}"); if(s.sec>0) AUTO.sec=s.sec; if(s.stop!=null) AUTO.stop=!!s.stop; }catch(e){}
const saveAuto=()=>{ try{ localStorage.setItem("sovereign-auto",JSON.stringify({sec:AUTO.sec,stop:AUTO.stop})); }catch(e){} };
function setAuto(on){
  AUTO.on=!!(on&&canPlay()); AUTO.left=AUTO.sec*1000; AUTO.last=performance.now();
  if(!AUTO.on) $("toast").classList.add("hidden");
  paintAuto();
}
// countdown pauses while a dialog is open, a turn is running, or you're typing a number
function autoHeld(){
  const a=document.activeElement;
  return UI.busy || !$("ov").classList.contains("hidden") || (a&&a.tagName==="INPUT"&&(a.type==="number"||a.type==="text"));
}
function paintAuto(){
  const b=$("bAuto"); b.classList.toggle("on",AUTO.on);
  b.textContent = !AUTO.on ? "▶ Auto" : autoHeld()&&!UI.busy ? "⏸ Paused" : "⏸ Stop";
  const p=AUTO.on?Math.max(0,Math.min(100,100*(1-AUTO.left/(AUTO.sec*1000)))):0; // End button fills up until the next turn
  $("end").style.background=AUTO.on?`linear-gradient(90deg,var(--acc) ${p}%,color-mix(in srgb,var(--acc) 45%,var(--panel2)) ${p}%)`:"";
  b.title = AUTO.on ? "Stop auto-run" : "End turns automatically";
}
setInterval(()=>{
  const now=performance.now(), dt=now-AUTO.last; AUTO.last=now;
  if(!AUTO.on) return;
  if(!autoHeld()){ AUTO.left-=dt; if(AUTO.left<=0){ AUTO.left=AUTO.sec*1000; endTurnNow(); } }
  paintAuto();
},100);
function showToast(html){ const t=$("toast"); t.innerHTML=html; t.classList.remove("hidden"); }
function toastReport(prev){
  const c=me(), d=c.land-prev.land, mine=G.battles.filter(b=>b.att===G.player||b.def===G.player).length;
  if(observing()){ const fell=G.battles.filter(b=>b.elim).length+(G.collapsed||[]).length;
    showToast(`<b>Year ${G.turn-1}</b> · ${fmt(G.battles.length)} battle${G.battles.length!==1?"s":""}${fell?` · <span class="acc">${fell} state${fell>1?"s":""} destroyed</span>`:""} · ${fmt(G.countries.filter(x=>x.alive).length)} left <button class="sm" data-a="report">Details</button>`); return; }
  showToast(`<b>Year ${G.turn-1}</b> · Land ${fmt(c.land)} ${d?`<span class="${d>0?'good':'bad'}">(${d>0?"+":""}${fmt(d)})</span>`:""} · ${mine?`<span class="acc">${mine} battle${mine>1?"s":""} involving you</span>`:`<span class="mut">quiet year</span>`} <button class="sm" data-a="report">Details</button>`);
}
$("bAuto").addEventListener("click",()=>{ if(!UI.busy||AUTO.on) setAuto(!AUTO.on); });
$("autoSec").value=String(AUTO.sec); if($("autoSec").value!==String(AUTO.sec)){ AUTO.sec=3; $("autoSec").value="3"; }
$("autoStop").checked=AUTO.stop;
$("autoSec").addEventListener("change",e=>{ AUTO.sec=+e.target.value; AUTO.left=AUTO.sec*1000; saveAuto(); paintAuto(); e.target.blur(); });
$("autoStop").addEventListener("change",e=>{ AUTO.stop=e.target.checked; saveAuto(); });
// last year's report for the player at the controls (hot-seat keeps one per player)
function lastPrev(){ return G ? (G.hot ? G.hot.prev?.[G.player] : UI.lastPrev) : null; }
// header dropdowns: the button with data-pop opens its panel; a click outside, a menu item or Escape closes it
function closePops(){ document.querySelectorAll(".pop").forEach(p=>{ p.hidden=true; }); document.querySelectorAll("[data-pop]").forEach(b=>b.setAttribute("aria-expanded","false")); }
document.addEventListener("click",e=>{
  const b=e.target.closest?.("[data-pop]");
  if(b){ const p=$(b.dataset.pop), open=p.hidden; closePops(); if(open){ if(b.id==="bMenu") $("bRep").disabled=!lastPrev(); p.hidden=false; b.setAttribute("aria-expanded","true"); } return; }
  if(e.target.closest?.(".pop>button")||!e.target.closest?.(".pop")) closePops();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.querySelector(".pop:not([hidden])")){ closePops(); e.stopPropagation(); } },true);
$("bRep").addEventListener("click",()=>{ const p=lastPrev(); if(p&&!UI.busy) turnReport(p); });
$("bHelp").addEventListener("click",()=>{ if(!UI.busy) helpModal(); });
$("bLog").addEventListener("click",()=>{ if(!UI.busy) changelogModal(); });
$("bSettings").addEventListener("click",()=>{ if(UI.busy) return; UI.sdraft=null; settingsModal("general"); });
$("bNew").addEventListener("click",()=>{ if(UI.busy) return; UI.setup=null; UI.fromWelcome=false; setupModal(); });
window.addEventListener("resize",()=>mainView.resize()); // map height follows the window
{ // draggable divider between map and side panel (wide screens only)
  const sp=$("split"), main=sp.parentElement, KEY="eb.sideWidth";
  const set=w=>{ const r=main.getBoundingClientRect(), max=Math.max(300,r.width-24-12-320);
    main.style.setProperty("--side",Math.round(Math.min(max,Math.max(300,w)))+"px"); };
  try{ const w=+localStorage.getItem(KEY); if(w) set(w); }catch(e){}
  sp.addEventListener("pointerdown",e=>{ e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add("drag"); document.body.classList.add("splitting"); });
  sp.addEventListener("pointermove",e=>{ if(!sp.hasPointerCapture(e.pointerId)) return;
    set(main.getBoundingClientRect().right-12-e.clientX-6); });
  const end=()=>{ if(!sp.classList.contains("drag")) return; sp.classList.remove("drag"); document.body.classList.remove("splitting");
    try{ localStorage.setItem(KEY,parseInt(main.style.getPropertyValue("--side"))||""); }catch(e){} };
  sp.addEventListener("pointerup",end); sp.addEventListener("pointercancel",end);
  sp.addEventListener("dblclick",()=>{ main.style.removeProperty("--side"); try{ localStorage.removeItem(KEY); }catch(e){} });
}
function flash(msg){ const n=document.createElement("div"); n.textContent=msg; n.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#341d1a;border:1px solid #6d2f27;padding:8px 14px;border-radius:8px;z-index:30"; document.body.appendChild(n); setTimeout(()=>n.remove(),2200); }

// boot
(async function(){
  const s=await loadSave();
  G = s&&!s.over ? s : await ENGINE.call("newGame",{nStates:8,terr:100,difficulty:1});
  render(); welcomeModal();
})();

</script>
